name: Deploy SnapBoard Public Site

on:
  push:
    branches: [main]
    paths:
      - 'snapboard-v2/**'
      - 'scripts/build-public-site.mjs'
      - 'apps/wiki/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/wiki-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build unified public site
        env:
          BASE_URL: /${{ github.event.repository.name }}/
        run: npm run site:build:public
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: snapboard-v2/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
