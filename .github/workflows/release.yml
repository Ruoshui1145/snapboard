name: SnapBoard Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: '已有的 vX.Y.Z 标签；手动运行时必须已推送'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        id: tag
        env:
          PUSH_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          INPUT_TAG: ${{ inputs.tag || '' }}
        run: |
          TAG="$PUSH_TAG"
          if [ -z "$TAG" ]; then TAG="$INPUT_TAG"; fi
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Release tag must match vX.Y.Z: $TAG" >&2; exit 1 ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify source and build public site
        env:
          BASE_URL: /${{ github.event.repository.name }}/
        run: |
          npm run build
          npm run site:build
          npm --workspace snapboard-v2 run verify:split
          npm --workspace snapboard-v2 run verify:split-shapes
          npm --workspace snapboard-v2 run verify:edge-holes
          npm --workspace snapboard-v2 run verify:holes
          npm --workspace snapboard-v2 run verify:assembly
          npm --workspace snapboard-v2 run verify:3mf

      - name: Package public site
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: tar -czf "SnapBoard-${TAG}-site.tar.gz" -C snapboard-v2/dist .

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh release create "$TAG" "SnapBoard-${TAG}-site.tar.gz" \
            --title "SnapBoard $TAG · Public Preview" \
            --latest \
            --generate-notes \
            --notes $'这是 SnapBoard 的公开测试预览版。\n\n本 Release 包含统一官网与在线设计器构建产物。配件资源包中的部分 STL/3MF/图片来自 MakeWorld 等公开页面，仅用于软件测试和回归，不用于商业化；商业化前必须逐项取得授权或移除，详见仓库根目录 THIRD_PARTY_NOTICES.md。'
