<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
  <title id="title">SnapBoard 受限代理碰撞装配流程</title>
  <desc id="desc">展示孔位完成后，零件沿法向插入、接触面碰到板面停止，再沿长孔向下滑移到孔底锁止；纯圆孔下滑为零。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111a2b"/><stop offset="1" stop-color="#202c45"/></linearGradient>
    <linearGradient id="part" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#72e1cf"/><stop offset="1" stop-color="#3187a9"/></linearGradient>
    <linearGradient id="board" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#3c82bb"/><stop offset="1" stop-color="#8b75b9"/></linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#65d8c6"/></marker>
    <marker id="goldArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#ffd166"/></marker>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1100" height="520" rx="24" fill="url(#bg)"/>
  <text x="48" y="54" fill="#eff8ff" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="700">受限代理碰撞：插入 → 贴面 → 下滑锁止</text>
  <text x="50" y="82" fill="#93a8c1" font-family="Microsoft YaHei, sans-serif" font-size="14">用户完成全部孔位后只播放一次；不扫描整颗 STL 三角网格</text>

  <g transform="translate(45 120)">
    <rect width="315" height="335" rx="18" fill="#172238" stroke="#385476"/>
    <text x="22" y="38" fill="#65d8c6" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="700">01  沿法向插入</text>
    <text x="22" y="66" fill="#a8bbcf" font-family="Microsoft YaHei, sans-serif" font-size="13">孔位已完成 · 接触面待碰撞</text>
    <rect x="227" y="84" width="18" height="212" rx="9" fill="url(#board)" opacity=".9"/>
    <rect x="220" y="84" width="32" height="212" rx="14" fill="#62a8ff" opacity=".12" stroke="#62a8ff" stroke-dasharray="5 5"/>
    <rect x="112" y="142" width="82" height="78" rx="18" fill="url(#part)" filter="url(#shadow)"/>
    <rect x="176" y="162" width="38" height="38" rx="12" fill="#ffd166" stroke="#ffe7a1" stroke-width="3"/>
    <path d="M105 181H55" stroke="#65d8c6" stroke-width="5" marker-end="url(#arrow)"/>
    <text x="36" y="245" fill="#65d8c6" font-family="Microsoft YaHei, sans-serif" font-size="12">插入方向</text>
    <text x="204" y="320" fill="#7f9bbb" font-family="Microsoft YaHei, sans-serif" font-size="12">板面代理体</text>
  </g>

  <g transform="translate(392 120)">
    <rect width="315" height="335" rx="18" fill="#172238" stroke="#385476"/>
    <text x="22" y="38" fill="#65d58a" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="700">02  接触面自动停止</text>
    <text x="22" y="66" fill="#a8bbcf" font-family="Microsoft YaHei, sans-serif" font-size="13">contactZ 命中板面碰撞层</text>
    <rect x="227" y="84" width="18" height="212" rx="9" fill="url(#board)" opacity=".9"/>
    <rect x="220" y="84" width="32" height="212" rx="14" fill="#65d58a" opacity=".22" stroke="#65d58a" stroke-width="2"/>
    <rect x="173" y="142" width="82" height="78" rx="18" fill="url(#part)" filter="url(#shadow)"/>
    <rect x="237" y="162" width="38" height="38" rx="12" fill="#ffd166" stroke="#ffe7a1" stroke-width="3"/>
    <path d="M166 181H126" stroke="#65d58a" stroke-width="5" marker-end="url(#arrow)"/>
    <circle cx="227" cy="181" r="13" fill="none" stroke="#65d58a" stroke-width="3"/>
    <text x="36" y="245" fill="#65d58a" font-family="Microsoft YaHei, sans-serif" font-size="12">碰撞命中 · 停止</text>
    <text x="190" y="320" fill="#7fbb9b" font-family="Microsoft YaHei, sans-serif" font-size="12">接触面贴合</text>
  </g>

  <g transform="translate(739 120)">
    <rect width="315" height="335" rx="18" fill="#172238" stroke="#385476"/>
    <text x="22" y="38" fill="#ffd166" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="700">03  沿长孔下滑锁止</text>
    <text x="22" y="66" fill="#a8bbcf" font-family="Microsoft YaHei, sans-serif" font-size="13">安装柱底边碰到 15 mm 孔底</text>
    <rect x="227" y="84" width="18" height="212" rx="9" fill="url(#board)" opacity=".9"/>
    <rect x="218" y="144" width="36" height="100" rx="17" fill="#ffd166" opacity=".12" stroke="#ffd166" stroke-width="2" stroke-dasharray="5 5"/>
    <rect x="173" y="176" width="82" height="78" rx="18" fill="url(#part)" filter="url(#shadow)"/>
    <rect x="237" y="196" width="38" height="38" rx="12" fill="#ffd166" stroke="#ffe7a1" stroke-width="3"/>
    <path d="M281 150V206" stroke="#ffd166" stroke-width="5" marker-end="url(#goldArrow)"/>
    <text x="270" y="137" fill="#ffd166" font-family="Microsoft YaHei, sans-serif" font-size="12">slideY</text>
    <text x="34" y="245" fill="#ffd166" font-family="Microsoft YaHei, sans-serif" font-size="12">碰底 · 锁止</text>
    <text x="186" y="320" fill="#d2b66b" font-family="Microsoft YaHei, sans-serif" font-size="12">圆孔：0 mm</text>
  </g>
</svg>
